name: Capture Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "src/**"
      - "README.md"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/capture-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: npm run capture:screenshots

      - name: Commit images back to branch
        run: |
          git config user.name "zazie-productions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "chore(images): refresh project screenshots [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
